<div class="revenue-report-container">
  <div class="page-header">
    <h1 class="page-title">รายงาน</h1>
  </div>

  <!-- Period Selector -->
  <div class="period-selector-card">
    <div class="button-toggle-group">
      <button 
        class="toggle-button"
        [class.active]="selectedPeriod() === 'daily'"
        (click)="selectPeriod('daily')">
        รายวัน
      </button>
      <button 
        class="toggle-button"
        [class.active]="selectedPeriod() === 'monthly'"
        (click)="selectPeriod('monthly')">
        รายเดือน
      </button>
      <button 
        class="toggle-button"
        [class.active]="selectedPeriod() === 'yearly'"
        (click)="selectPeriod('yearly')">
        รายปี
      </button>
    </div>

    <!-- Date Pickers -->
    <div class="date-picker-section">
      <!-- Daily Date Picker -->
      <div class="date-picker-group" *ngIf="selectedPeriod() === 'daily'">
        <label for="daily-date">เลือกวันที่:</label>
        <input 
          type="date" 
          id="daily-date"
          class="date-input"
          [value]="selectedDate()"
          (change)="selectedDate.set($any($event.target).value)" />
      </div>

      <!-- Monthly Picker -->
      <div class="date-picker-group" *ngIf="selectedPeriod() === 'monthly'">
        <label for="month-select">เลือกเดือน:</label>
        <select 
          id="month-select"
          class="date-select"
          [value]="selectedMonth()"
          (change)="selectedMonth.set(+$any($event.target).value)">
          <option *ngFor="let month of months" [value]="month.value">
            {{ month.label }}
          </option>
        </select>
        
        <label for="month-year-select">ปี:</label>
        <select 
          id="month-year-select"
          class="date-select"
          [value]="selectedYear()"
          (change)="selectedYear.set(+$any($event.target).value)">
          <option *ngFor="let year of years" [value]="year">
            {{ year }}
          </option>
        </select>
      </div>

      <!-- Yearly Picker -->
      <div class="date-picker-group" *ngIf="selectedPeriod() === 'yearly'">
        <label for="year-select">เลือกปี:</label>
        <select 
          id="year-select"
          class="date-select"
          [value]="selectedYear()"
          (change)="selectedYear.set(+$any($event.target).value)">
          <option *ngFor="let year of years" [value]="year">
            {{ year }}
          </option>
        </select>
      </div>

      <button class="search-button" (click)="loadReport()">
        ค้นหา
      </button>
    </div>
  </div>

  <!-- Error Message -->
  <div class="error-message" *ngIf="error()">
    {{ error() }}
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="loading()">
    <div class="spinner"></div>
    <p>กำลังโหลดรายงาน...</p>
  </div>

  <!-- Report Metrics -->
  <div class="metrics-container" *ngIf="report() && !loading()">
    <!-- Total Revenue Card -->
    <div class="metric-card revenue-card">
      <div class="metric-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/>
        </svg>
      </div>
      <div class="metric-content">
        <div class="metric-label">รายได้รวม</div>
        <div class="metric-value">{{ formatCurrency(report()!.totalRevenue) }}</div>
      </div>
    </div>

    <!-- Rooms Sold Card -->
    <div class="metric-card rooms-card">
      <div class="metric-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V6H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
        </svg>
      </div>
      <div class="metric-content">
        <div class="metric-label">จำนวนห้องที่ขาย</div>
        <div class="metric-value">{{ report()!.roomsSold }}</div>
      </div>
    </div>

    <!-- Booking Count Card -->
    <div class="metric-card bookings-card">
      <div class="metric-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
        </svg>
      </div>
      <div class="metric-content">
        <div class="metric-label">จำนวนการจอง</div>
        <div class="metric-value">{{ report()!.bookingCount }}</div>
      </div>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="charts-container" *ngIf="report() && !loading() && report()!.details && report()!.details!.length > 0">
    <!-- Revenue Bar Chart -->
    <div class="chart-card">
      <h3 class="chart-title">รายได้ตามช่วงเวลา</h3>
      <div class="chart-wrapper">
        <svg class="bar-chart" viewBox="0 0 100 100" preserveAspectRatio="none">
          <g *ngFor="let point of revenueChartData(); let i = index">
            <rect 
              [attr.x]="i * (100 / revenueChartData().length)" 
              [attr.y]="100 - getBarHeight(point.value, getMaxValue(revenueChartData()))"
              [attr.width]="(100 / revenueChartData().length) - 2"
              [attr.height]="getBarHeight(point.value, getMaxValue(revenueChartData()))"
              class="bar"
              [attr.data-value]="formatCurrency(point.value)">
            </rect>
          </g>
        </svg>
        <div class="chart-labels">
          <span *ngFor="let point of revenueChartData()" class="chart-label">
            {{ point.label }}
          </span>
        </div>
      </div>
    </div>

    <!-- Booking Line Chart -->
    <div class="chart-card">
      <h3 class="chart-title">แนวโน้มการจอง</h3>
      <div class="chart-wrapper">
        <svg class="line-chart" viewBox="0 0 100 100" preserveAspectRatio="none">
          <!-- Grid lines -->
          <line x1="0" y1="25" x2="100" y2="25" class="grid-line" />
          <line x1="0" y1="50" x2="100" y2="50" class="grid-line" />
          <line x1="0" y1="75" x2="100" y2="75" class="grid-line" />
          
          <!-- Line -->
          <polyline 
            [attr.points]="getChartPoints(bookingChartData())"
            class="line"
            fill="none">
          </polyline>
          
          <!-- Data points -->
          <g *ngFor="let point of bookingChartData(); let i = index">
            <circle 
              [attr.cx]="i * (100 / (bookingChartData().length - 1 || 1))"
              [attr.cy]="100 - getBarHeight(point.value, getMaxValue(bookingChartData()))"
              r="2"
              class="data-point"
              [attr.data-value]="point.value + ' การจอง'">
            </circle>
          </g>
        </svg>
        <div class="chart-labels">
          <span *ngFor="let point of bookingChartData()" class="chart-label">
            {{ point.label }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
